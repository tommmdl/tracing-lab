spec:
  template:
    spec:
      containers:
      - name: api
        image: ghcr.io/tommmdl/docker-lab@sha256:e01c467c0987cc2d999778a4e9ee429bee1d6af4bcdef80e38ce620b95a0b8da
        imagePullPolicy: IfNotPresent
        env:
        - name: OTEL_SERVICE_NAME
          value: notes-api
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: service.namespace=notes-lab,deployment.environment.name=lab
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://collector.tracing-lab.svc.cluster.local:4318
        - name: OTEL_EXPORTER_OTLP_PROTOCOL
          value: http/protobuf
        - name: OTEL_TRACES_SAMPLER
          value: parentbased_always_on
