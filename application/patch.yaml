spec:
  template:
    spec:
      containers:
      - name: api
        image: ghcr.io/tommmdl/docker-lab@sha256:853f73da8162b912275458bd46073ebb74c63f8b52e2545946acb0c50e804d31
        imagePullPolicy: IfNotPresent
        env:
        - name: OTEL_SERVICE_NAME
          value: notes-api
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: service.namespace=notes-lab,deployment.environment.name=lab
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://collector.tracing-lab.svc.cluster.local:4318
        - name: OTEL_EXPORTER_OTLP_PROTOCOL
          value: http/protobuf
        - name: OTEL_TRACES_SAMPLER
          value: parentbased_always_on
